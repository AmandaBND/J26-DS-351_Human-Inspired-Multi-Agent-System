]
requires-python = ">=3.11,<3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.4",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "pandas>=3.0.6",
